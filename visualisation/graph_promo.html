    const hudEl = document.getElementById('hud-callout');
    const hudTypeEl = document.getElementById('hud-callout-type');
    const hudNameEl = document.getElementById('hud-callout-name');
    
    let hoveredNode = null;
    let activeTargetNode = null;

    const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData(gData)
      .backgroundColor('#030712')
      .nodeLabel(null) 
      .nodeAutoColorBy('type')
      .nodeRelSize(4.5)
      .linkWidth(0.5)
      .linkOpacity(0.2)
      .linkDirectionalParticles(2)
      .linkDirectionalParticleSpeed(0.005)
      .linkDirectionalParticleWidth(1.2)
      .onNodeHover(node => {
        hoveredNode = node;
        if (node) {
          hudTypeEl.textContent = (node.type || 'Element').replace(/([A-Z])/g, ' $1').trim();
          hudNameEl.textContent = node.name || node.id;
          hudEl.classList.add('visible');
        } else {
          hudEl.classList.remove('visible');
          activeTargetNode = null; 
        }
      });

    const candidateNodes = gData.nodes.filter(n => n.type === 'BusinessFunction' || n.type === 'BusinessObject');

    function smoothstep(min, max, value) {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    }

    // --- TIMELINE CONTROLLER ---
    let lastTime = performance.now();
    let animTime = 0;
    let isPlaying = true;
    let isRestarting = false;
    
    let randomHudEnabled = true;
    let lastRandomHudTime = performance.now();
    let currentOrbitAngle = 0;
    let insideAngle = 0;

    const graphContainer = document.getElementById('3d-graph');
    ['pointerdown', 'touchstart', 'wheel'].forEach(evt => {
      graphContainer.addEventListener(evt, () => { 
        if (isPlaying && !isRestarting) {
          isPlaying = false;
          document.getElementById('anim-play-pause').innerHTML = '&#9658; Play';
        }
      }, { passive: true });
    });

    function animateSequence(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // 1. Camera Animation Logic
      if (isPlaying && !isRestarting) {
        animTime += dt;
        let t = animTime;

        let camX = 0, camY = 150, camZ = 1350;
        let lookX = 0, lookY = 0, lookZ = 0;

        if (t < 2.0) {
          const p = t / 2.0;
          const ease = 1 - Math.pow(1 - p, 3);
          camZ = 4500 - (4500 - 1350) * ease;
          camY = 300 - 150 * ease;
        }
        else if (t >= 2.0 && t < 14.5) {
          currentOrbitAngle += 0.0035;
          const radius = 1350;
          camX = radius * Math.sin(currentOrbitAngle);
          camZ = radius * Math.cos(currentOrbitAngle);
          camY = 150 + 40 * Math.sin(currentOrbitAngle * 0.8);
        }
        else if (t >= 14.5 && t < 19.5) {
          const p = (t - 14.5) / 5.0;
          const ease = smoothstep(0, 1, p);

          currentOrbitAngle += 0.003;
          const currentRadius = 1350 - (1350 - 190) * ease;
          const currentY = (150 + 40 * Math.sin(currentOrbitAngle * 0.8)) * (1 - ease) + 30 * ease;

          camX = currentRadius * Math.sin(currentOrbitAngle);
          camZ = currentRadius * Math.cos(currentOrbitAngle);
          camY = currentY;

          lookX = 40 * ease;
          lookY = 10 * ease;
          lookZ = 0;
        }
        else {
          insideAngle += 0.003;
          const innerRadius = 190;

          camX = innerRadius * Math.sin(currentOrbitAngle + insideAngle);
          camZ = innerRadius * Math.cos(currentOrbitAngle + insideAngle);
          camY = 30 + 15 * Math.sin(insideAngle * 1.4);

          lookX = 30 * Math.cos(insideAngle);
          lookY = 10;
          lookZ = 30 * Math.sin(insideAngle);
        }

        Graph.cameraPosition({ x: camX, y: camY, z: camZ }, { x: lookX, y: lookY, z: lookZ });
      }

      // 2. Independent Random HUD Logic
      if (randomHudEnabled && !hoveredNode) {
        if (now - lastRandomHudTime > 3000) { 
          lastRandomHudTime = now;
          
          if (candidateNodes.length > 0) {
            activeTargetNode = candidateNodes[Math.floor(Math.random() * candidateNodes.length)];
            hudTypeEl.textContent = (activeTargetNode.type || 'Element').replace(/([A-Z])/g, ' $1').trim();
            hudNameEl.textContent = activeTargetNode.name;
            hudEl.classList.add('visible');
            
            setTimeout(() => {
              if (activeTargetNode && !hoveredNode) {
                hudEl.classList.remove('visible');
                activeTargetNode = null;
              }
            }, 1500);
          }
        }
      }

      // 3. HUD Positioning
      let targetPosNode = hoveredNode || activeTargetNode;
      if (targetPosNode && targetPosNode.x !== undefined && Graph.graph2ScreenCoords) {
        const pos = Graph.graph2ScreenCoords(targetPosNode.x, targetPosNode.y, targetPosNode.z);
        if (pos) {
          hudEl.style.left = pos.x + 'px';
          hudEl.style.top = pos.y + 'px';
        }
      } else if (!hoveredNode && !activeTargetNode) {
        hudEl.classList.remove('visible');
      }

      requestAnimationFrame(animateSequence);
    }

    requestAnimationFrame((now) => {
      lastTime = now;
      lastRandomHudTime = now;
      animateSequence(now);
    });

    // --- ANIMATION & LABELS CONTROLLER LISTENERS ---
    const btnAnimPlayPause = document.getElementById('anim-play-pause');
    const btnAnimStop = document.getElementById('anim-stop');
    const btnAnimRestart = document.getElementById('anim-restart');
    const btnHudToggle = document.getElementById('anim-hud-toggle');
    const animCtrl = document.getElementById('animation-controller');

    ['pointerdown', 'touchstart', 'click'].forEach(evt => {
      animCtrl.addEventListener(evt, (e) => e.stopPropagation());
    });

    btnAnimPlayPause.addEventListener('click', () => {
      if (isRestarting) return; 
      isPlaying = !isPlaying;
      btnAnimPlayPause.innerHTML = isPlaying ? '&#10074;&#10074; Pause' : '&#9658; Play';
    });

    btnAnimStop.addEventListener('click', () => {
      if (isRestarting) return;
      isPlaying = false;
      btnAnimPlayPause.innerHTML = '&#9658; Play';
    });

    btnAnimRestart.addEventListener('click', () => {
      isPlaying = false;
      isRestarting = true;
      animTime = 0;
      currentOrbitAngle = 0;
      insideAngle = 0;
      activeTargetNode = null;
      hudEl.classList.remove('visible');
      btnAnimPlayPause.innerHTML = '&#10074;&#10074; Pause'; 

      Graph.cameraPosition({ x: 0, y: 150, z: 4500 }, { x: 0, y: 0, z: 0 }, 2000);

      setTimeout(() => {
        isRestarting = false;
        isPlaying = true;
        lastTime = performance.now(); 
      }, 2050);
    });

    btnHudToggle.addEventListener('click', () => {
      randomHudEnabled = !randomHudEnabled;
      btnHudToggle.innerHTML = randomHudEnabled ? 'ON' : 'OFF';
      btnHudToggle.classList.toggle('active', randomHudEnabled);
      
      if (!randomHudEnabled && !hoveredNode) {
         hudEl.classList.remove('visible');
         activeTargetNode = null;
      }
    });

    // --- ROBUST AUDIO CONTROLS ---
    const audio = document.getElementById('bg-audio');
    const btnAudioPlayPause = document.getElementById('btn-play-pause');
    const btnAudioStop = document.getElementById('btn-stop');
    const btnAudioRestart = document.getElementById('btn-restart');
    const audioCtrl = document.getElementById('audio-controller');

    ['pointerdown', 'touchstart', 'click'].forEach(evt => {
      audioCtrl.addEventListener(evt, (e) => e.stopPropagation());
    });

    function tryPlayAudio() {
      const promise = audio.play();
      if (promise !== undefined) {
        promise.then(() => {
          btnAudioPlayPause.innerHTML = '&#10074;&#10074; Pause';
        }).catch(() => {
          btnAudioPlayPause.innerHTML = '&#9658; Play';
          
          const unlockEvents = ['pointerdown', 'touchstart', 'touchend', 'click', 'keydown'];
          const unlock = (e) => {
            if (e && e.target && e.target.closest('#audio-controller')) return;
            audio.play().then(() => {
              btnAudioPlayPause.innerHTML = '&#10074;&#10074; Pause';
            }).catch(() => {});
            
            unlockEvents.forEach(evt => window.removeEventListener(evt, unlock));
          };
          
          unlockEvents.forEach(evt => window.addEventListener(evt, unlock, { once: true }));
        });
      }
    }

    tryPlayAudio();

    btnAudioPlayPause.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btnAudioPlayPause.innerHTML = '&#10074;&#10074; Pause';
      } else {
        audio.pause();
        btnAudioPlayPause.innerHTML = '&#9658; Play';
      }
    });

    btnAudioStop.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      btnAudioPlayPause.innerHTML = '&#9658; Play';
    });

    btnAudioRestart.addEventListener('click', () => {
      audio.currentTime = 0;
      audio.play();
      btnAudioPlayPause.innerHTML = '&#10074;&#10074; Pause';
    });
  </script>
</body>
</html>
